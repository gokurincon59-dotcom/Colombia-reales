input:focus{border-color:#ff1825;box-shadow:0 0 0 3px rgba(255,24,37,.22)}.f input{padding-right:48px}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:38px;height:38px;background:none;border:0;color:#b9aeb0;cursor:pointer;font-size:18px}
.go{width:100%;margin-top:18px;padding:14px;border:0;border-radius:12px;background:linear-gradient(135deg,#e01322,#8f0b16);color:#fff;font:22px "Bebas Neue",Impact,sans-serif;letter-spacing:3px;cursor:pointer;box-shadow:0 0 26px rgba(255,24,37,.45);transition:transform .2s,filter .2s}
.go:hover{transform:translateY(-2px);filter:brightness(1.1)}.go:disabled{opacity:.7;cursor:wait;transform:none}
.er{display:none;margin:14px 0 0;padding:10px 12px;border-radius:10px;background:rgba(255,24,37,.12);border:1px solid #ff4550;color:#ffb3b8;font-size:13px}
.ft{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:16px;font-size:12px}.ft a{color:#ff6870;text-decoration:none}
.nt{margin-top:12px;font-size:11px;color:#8e8589;line-height:1.5;text-align:center}
.tw{animation:tw 2.4s ease-in-out infinite}@keyframes tw{50%{opacity:.25}}
@media(max-width:700px){#tr{height:30vh;right:-2vw}.pl{display:none}}
@media(prefers-reduced-motion:reduce){.c,.tw{animation:none}}
</style></head><body>

<path d="M130 40 l10 26 28 2-22 18 8 27-24-15-24 15 8-27-22-18 28-2z" fill="#ffd66b"/>

<rect x="196" y="380" width="40" height="30" fill="#003893"/><path d="M216 380v30M196 395h40" stroke="#ffd66b" stroke-width="5"/>
<rect x="150" y="390" width="34" height="20" fill="#FCD116"/><path d="M167 390v20" stroke="#ce1126" stroke-width="5"/></svg>
<div class="c">
  <img class="lg" src="assets/logo-cr.webp" alt="Colombia Reals" width="78" height="78">
  <h1>COLOMBIA <b>REALS</b></h1><span class="tag">⚙️ ADMINISTRADOR</span>
  <p class="s">Ingresa tu usuario y contraseña para abrir el panel.</p>
  <form id="f" autocomplete="on" novalidate>
    <label for="u">Usuario</label><input id="u" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    <label for="p">Contraseña</label>
    <div class="f"><input id="p" name="password" type="password" autocomplete="current-password" required><button type="button" class="eye" id="eye" aria-label="Mostrar contraseña">👁</button></div>
    <div class="er" id="er" role="alert"></div>
    <button class="go" id="go" type="submit">ENTRAR AL PANEL</button>
  </form>
  <div class="ft"><a href="index.html">← Volver al catálogo</a><a href="staff.html">Panel del staff</a><a href="login.html">Entrar con Discord</a></div>
  <div class="nt">🔒 Solo para el equipo. Tras 5 intentos fallidos el acceso se bloquea 15 minutos.</div>
</div>
<script>
(()=>{
const C=window.CR||{},$=i=>document.getElementById(i),K='cr_admin',NS='http://www.w3.org/2000/svg',R=Math.random;
const api=(C.apiUrl||'').replace(/\/+$/,'')+'/api';
try{const s=JSON.parse(sessionStorage.getItem(K)||'null');if(s&&s.e>Date.now()&&s.t){location.replace('panel.html');return}else sessionStorage.removeItem(K)}catch(e){}
/* ---------- Paisaje: estrellas, ciudad, luces del árbol ---------- */
const mk=(p,t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e};
for(let i=0;i<90;i++)mk($('st'),'circle',{cx:R()*1200,cy:R()*330,r:R()*1.4+.3,fill:'#fff',opacity:.35+R()*.6,class:i%4?'':'tw',style:'animation-delay:'+(R()*3).toFixed(1)+'s'});
for(let x=20;x<1200;x+=28+R()*26){if(x>180&&x<400)continue;const h=28+R()*80,w=22+R()*22,y=508-h+(R()*10);mk($('ct'),'rect',{x,y,width:w,height:508-y});
  for(let k=0;k<h/14;k++)for(let j=0;j<w/11;j++)if(R()<.45)mk($('wn'),'rect',{x:x+3+j*10,y:y+4+k*13,width:4,height:6,fill:R()<.8?'#ffcf6b':'#fff1b8',opacity:.8,class:R()<.12?'tw':'',style:'animation-delay:'+(R()*3).toFixed(1)+'s'})}
const col=['#ff3b3b','#ffd66b','#3b8cff','#ffffff','#ff7ad9'],rows=[[130,120,0],[130,190,0]];
for(let i=0;i<46;i++){const y=95+R()*270,half=(y-40)*.52*(y<250?1:1.02),x=130+(R()*2-1)*Math.min(half,110);if(y<110&&Math.abs(x-130)>12)continue;mk($('tl'),'circle',{cx:x,cy:y,r:3.2,fill:col[i%5],class:'tw',style:'animation-delay:'+(R()*2.4).toFixed(1)+'s'})}
/* ---------- Pólvora ---------- */
const cv=$('fw'),g=cv.getContext('2d'),still=matchMedia('(prefers-reduced-motion:reduce)').matches;let ps=[],rk=[];
const rs=()=>{cv.width=innerWidth;cv.height=innerHeight};rs();addEventListener('resize',rs);
const burst=(x,y)=>{const h=R()*360,n=70;for(let i=0;i<n;i++){const a=Math.PI*2*i/n,v=1.5+R()*3.2;ps.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,h:h+R()*50})}};
const launch=()=>{rk.push({x:innerWidth*(.1+R()*.8),y:innerHeight*.62,ty:innerHeight*(.12+R()*.3),h:R()*360})};
if(!still){(function loop(){g.globalCompositeOperation='destination-out';g.fillStyle='rgba(0,0,0,.2)';g.fillRect(0,0,cv.width,cv.height);g.globalCompositeOperation='lighter';
rk=rk.filter(r=>{r.y-=5;g.fillStyle='#ffe9a8';g.fillRect(r.x,r.y,2,6);if(r.y<=r.ty){burst(r.x,r.y);return false}return true});
ps=ps.filter(q=>q.l>0);for(const q of ps){q.x+=q.vx;q.y+=q.vy;q.vx*=.97;q.vy=q.vy*.97+.05;q.l-=.013;g.fillStyle='hsla('+q.h+',100%,60%,'+q.l+')';g.fillRect(q.x,q.y,2.2,2.2)}requestAnimationFrame(loop)})();
setInterval(launch,1300);setTimeout(launch,200);setTimeout(launch,700);
addEventListener('pointerdown',e=>{if(!e.target.closest('.c'))burst(e.clientX,e.clientY)})}
/* ---------- Login (igual que antes) ---------- */
const er=$('er'),go=$('go'),bad=m=>{er.textContent=m;er.style.display='block'};
$('eye').onclick=()=>{const p=$('p'),v=p.type==='password';p.type=v?'text':'password';$('eye').textContent=v?'🙈':'👁'};
if(new URLSearchParams(location.search).get('e')==='expired')bad('Tu sesión de administrador terminó. Ingresa de nuevo.');
$('f').addEventListener('submit',async ev=>{
  ev.preventDefault();er.style.display='none';
  const user=$('u').value.trim(),pass=$('p').value;
  if(!user||!pass){bad('Escribe tu usuario y tu contraseña.');return}
  go.disabled=true;go.textContent='VERIFICANDO…';
  try{
    const r=await fetch(api+'/admin/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({user,pass})});
    let d={};try{d=await r.json()}catch(e){}
    if(!r.ok||!d.token){if(r.status===404)throw new Error('No se encontró el servidor del catálogo. Revisa que el sitio esté publicado con la carpeta netlify.');throw new Error(d.error||'No se pudo iniciar sesión ('+r.status+').')}
    sessionStorage.setItem(K,JSON.stringify({t:d.token,e:d.exp,n:(d.user&&d.user.name)||user}));$('p').value='';
    if(!still)for(let i=0;i<4;i++)setTimeout(()=>burst(innerWidth*(.2+R()*.6),innerHeight*(.2+R()*.3)),i*120);
    setTimeout(()=>location.replace('panel.html'),still?0:700);
  }catch(e){bad(e instanceof TypeError?'No hay conexión con el servidor. Inténtalo de nuevo.':e.message);go.disabled=false;go.textContent='ENTRAR AL PANEL';$('p').focus();$('p').select()}
});
$('u').focus();
})();
</script></body></html>
